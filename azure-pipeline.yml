trigger:
  batch: true
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-24.04

variables:
  azureServiceConnection: papertrail-azure
  webAppName: papertrail-java-rm561584

stages:
  - stage: CI
    displayName: Build and test
    jobs:
      - job: Build
        steps:
          - checkout: self
            clean: true

          - bash: chmod +x gradlew
            displayName: Prepare Gradle wrapper

          - task: Gradle@4
            displayName: Build and run tests
            inputs:
              gradleWrapperFile: gradlew
              tasks: clean build
              options: --no-daemon
              publishJUnitResults: false
              javaHomeOption: JDKVersion
              jdkVersionOption: '1.17'
              jdkArchitectureOption: x64
            env:
              OPENAI_API_KEY: ''

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/TEST-*.xml'
              searchFolder: $(System.DefaultWorkingDirectory)/build/test-results/test
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: true
              testRunTitle: PaperTrail Java

          - bash: |
              set -euo pipefail
              mkdir -p "$(Build.BinariesDirectory)/publish"
              jar_path=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar')
              cp "$jar_path" "$(Build.BinariesDirectory)/publish/app.jar"
              cp scripts/startup.sh "$(Build.BinariesDirectory)/publish/startup.sh"
            displayName: Prepare API package

          - task: ArchiveFiles@2
            displayName: Package API
            inputs:
              rootFolderOrFile: $(Build.BinariesDirectory)/publish
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/PaperTrail.Java.zip

          - task: PublishPipelineArtifact@1
            displayName: Publish API artifact
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/PaperTrail.Java.zip
              artifact: api

  - stage: Release
    displayName: Deploy API
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Deploy
        steps:
          - checkout: none

          - download: current
            artifact: api

          - task: AzureWebApp@1
            displayName: Deploy to App Service
            inputs:
              azureSubscription: $(azureServiceConnection)
              appType: webAppLinux
              appName: $(webAppName)
              package: $(Pipeline.Workspace)/api/PaperTrail.Java.zip
              startUpCommand: bash /home/site/wwwroot/startup.sh

          - bash: |
              curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --max-time 20 \
                "https://$(webAppName).azurewebsites.net/v3/api-docs" --output /dev/null
            displayName: Check published API
