spring.application.name=PaperTrail

spring.datasource.url=${DATABASE_URL:jdbc:oracle:thin:@//oracle.fiap.com.br:1521/ORCL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.data.web.pageable.max-page-size=100
# The database script is installed separately.
spring.flyway.enabled=false
spring.docker.compose.enabled=false

papertrail.jwt.public-key=${JWT_PUBLIC_KEY}
papertrail.jwt.private-key=${JWT_PRIVATE_KEY}

server.error.include-message=never
server.error.include-stacktrace=never

# --- Orientação com IA (Spring AI + OpenAI) ---
# A chave NUNCA fica no repositório: defina a variável de ambiente OPENAI_API_KEY.
spring.ai.openai.api-key=${OPENAI_API_KEY:sem-chave-configurada}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-5-mini}
spring.ai.openai.timeout=${OPENAI_TIMEOUT:30s}
spring.ai.openai.max-retries=1
spring.ai.openai.chat.max-completion-tokens=${OPENAI_MAX_COMPLETION_TOKENS:2000}

# --- Recuperação lexical (BM25) ---
papertrail.guidance.top-k=3
papertrail.guidance.max-context-chars=3000
papertrail.guidance.min-match-ratio=0.34
